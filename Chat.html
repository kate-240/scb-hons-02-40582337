<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sound</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: #fff;
      background-image: url('blue.jpg');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      padding: 20px;
    }

    header .header {
      position: relative;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.4); /* transparent */
      padding: 20px;
      border-radius: 12px;
    }

    .header img {
      width: 100%;
      max-width: 600px;
      height: auto;
      border-radius: 10px;
    }

    .header-centered {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 600;
      color: #f1f1f1;
      text-shadow: 2px 2px 8px #000;
    }

    nav {
      margin: 20px 0;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 15px;
    }

    nav li {
      list-style: none;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 6px 12px;
      transition: background 0.3s;
    }

    nav a:hover {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
    }

    nav img {
      margin-left: auto;
      height: 40px;
    }

    .chat-container {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 12px;
      max-width: 600px;
      margin: auto;
    }

    .chat-header {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .chat-messages {
      background-color: rgba(255, 255, 255, 0.1);
      height: 250px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .chat-message {
      margin-bottom: 10px;
    }

    .chat-message span {
      font-weight: bold;
      margin-right: 6px;
      color: #00aced;
    }

    .chat-input {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-input input, .chat-input button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }

    .chat-input input {
      background-color: rgba(255, 255, 255, 0.8);
      color: #000;
    }

    .chat-input button {
      background-color: #00aced;
      color: white;
      cursor: pointer;
    }

    .chat-input button:hover {
      background-color: #0084a8;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header">
      <img src="banner.jpg" alt="Banner">
      <div class="header-centered">Welcome to Sound</div>
    </div>
  </header>

  <!-- ✅ NAVIGATION BAR -->
  <nav>
    <li><a href="home.html">Home</a></li>
    <li><a href="blog.html">Blog</a></li>
    <li><a href="media.html">Media</a></li>
    <li><a href="Chat.html">Chat</a></li>
    <li><a href="map.html">Map</a></li>
    <li><a href="info.html">Information</a></li>
    <img src="logo.jpg" alt="Logo">
  </nav>

  <!-- ✅ CHAT ROOM -->
  <div class="chat-container">
    <div class="chat-header">💬 Chat Room</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="username" placeholder="Your name" />
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');

    window.onload = function () {
      const savedMessages = JSON.parse(localStorage.getItem('communityChat')) || [];
      savedMessages.forEach(({ username, message }) => {
        appendMessage(username, message);
      });
    };

    function sendMessage() {
      const username = document.getElementById('username').value.trim();
      const message = document.getElementById('messageInput').value.trim();
      if (!username || !message) return;

      appendMessage(username, message);

      const savedMessages = JSON.parse(localStorage.getItem('communityChat')) || [];
      savedMessages.push({ username, message });
      localStorage.setItem('communityChat', JSON.stringify(savedMessages));

      document.getElementById('messageInput').value = '';
    }

    function appendMessage(username, message) {
      const newMessage = document.createElement('div');
      newMessage.classList.add('chat-message');
      newMessage.innerHTML = `<span>${username}:</span> ${message}`;
      chatMessages.appendChild(newMessage);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</body>
</html>
